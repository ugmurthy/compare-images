<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare Sketch</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --border: #d9dee7;
        --border-strong: #aeb7c5;
        --control-bg: #eef2f6;
        --text: #1f2933;
        --muted: #637083;
        --accent: #246bfe;
        --accent-hover: #1d56d8;
        --accent-soft: rgba(36, 107, 254, 0.16);
        --danger: #c83232;
        --success: #138a45;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      button,
      input {
        font: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      label:focus-within {
        outline: 3px solid var(--accent-soft);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
